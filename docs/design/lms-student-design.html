<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LMS — Student design</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F7;--panel:#FFFFFF;--tx:#171C2B;--mut:#586078;--line:#D9DEEA;--accent:#1E2A5E;--gold:#F2A900;--chip:#E7EBF6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1220;--panel:#171D31;--tx:#E8ECF7;--mut:#9AA4BE;--line:#2B3452;--accent:#9DB0FF;--gold:#F2B81F;--chip:#232C4A}}
:root[data-theme="dark"]{--bg:#0E1220;--panel:#171D31;--tx:#E8ECF7;--mut:#9AA4BE;--line:#2B3452;--accent:#9DB0FF;--gold:#F2B81F;--chip:#232C4A}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.hero{padding:34px 0 18px}header.hero h1{font-size:clamp(26px,4vw,40px);line-height:1.1}header.hero p{color:var(--mut);max-width:70ch;margin:10px 0 0}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .trow{display:flex;gap:4px;overflow-x:auto;padding:8px 20px;max-width:1180px;margin:0 auto}
.tabs button{flex:none;border:0;background:transparent;color:var(--mut);font:600 14px 'Figtree',system-ui,sans-serif;padding:9px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tabs button:hover{background:var(--chip);color:var(--tx)}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{color:#0E1220}}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{color:#0E1220}
section.page{padding:26px 0 60px}.page h2{font-size:clamp(22px,3vw,30px)}.purpose{color:var(--mut);margin:6px 0 18px;max-width:75ch}
.stage{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px}
.stage-note{font-size:13px;color:var(--mut);margin:8px 2px 0}
.info{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:22px}@media (max-width:820px){.info{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}.box h3{font-size:18px;margin-bottom:10px}
.feat{margin:0;padding:0;list-style:none;display:grid;gap:9px}.feat li{padding-left:22px;position:relative}
.feat li::before{content:"";position:absolute;left:2px;top:.6em;width:9px;height:9px;border-radius:3px;background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chips span{background:var(--chip);border-radius:999px;padding:4px 11px;font-size:13px}
/* mockup (always light) */
.frame{--ink:#1E2A5E;--ink2:#2C3B80;--gold:#F2A900;--mbg:#F3F5FA;--card:#fff;--ln:#E2E6EF;--t:#1B2233;--mu:#6A7388;--ok:#1E9E6A;--bad:#D64545;min-width:1000px;display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:var(--mbg);color:var(--t);font-size:12.5px;line-height:1.45;min-height:540px;text-align:left;position:relative}
.frame *{box-sizing:border-box}
.side{width:186px;flex:none;background:var(--ink);color:#C9D0EE;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:9px;color:#fff;font:700 16px 'Bricolage Grotesque',sans-serif;padding:2px 6px 12px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--gold);display:grid;place-items:center;color:var(--ink)}
.grp{font-size:11px;color:#8D98CF;padding:10px 8px 3px}
.nav{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px}.nav.on{background:#fff;color:var(--ink);font-weight:700}
.side .foot{margin-top:auto;font-size:11px;color:#8D98CF;padding:8px}
.mainc{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--ln)}
.top h4{margin:0 auto 0 0;font:700 16px 'Bricolage Grotesque',sans-serif}
.sbox{display:flex;align-items:center;gap:6px;border:1px solid var(--ln);border-radius:8px;padding:6px 10px;color:var(--mu);width:240px;background:var(--mbg)}
.bell{position:relative;display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--ln);border-radius:8px;color:var(--mu)}
.bell em{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-style:normal;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center}
.av{display:flex;align-items:center;gap:7px}.av i{width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--ink);font-style:normal;font-weight:700;display:grid;place-items:center}
.body{padding:14px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.cardm{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px 14px}
.cardm h5{margin:0 0 8px;font:700 13.5px 'Figtree',sans-serif;display:flex;justify-content:space-between}.cardm h5 small{font-weight:500;color:var(--mu)}
.row{display:flex;gap:12px}.row>*{min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi .lb,.mu{color:var(--mu)}.kpi .v{font:700 22px 'Bricolage Grotesque',sans-serif;margin:2px 0}.up{color:var(--ok)}
.bt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:var(--card);color:var(--t);border-radius:8px;padding:6px 11px;font:600 12.5px 'Figtree',sans-serif;white-space:nowrap}
.bt.pr{background:var(--ink);border-color:var(--ink);color:#fff}.bt.gd{background:var(--gold);border-color:var(--gold);color:#241800}.bt.lg{padding:10px 14px;font-size:14px}
.pl{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600}
.pl.ok{background:#E3F6EE;color:#12784F}.pl.wa{background:#FFF1D6;color:#8A5600}.pl.bad{background:#FBE4E4;color:#A62B2B}.pl.in{background:#E6EAF8;color:var(--ink)}
table.tb{width:100%;border-collapse:collapse}.tb th{text-align:left;font-weight:600;color:var(--mu);padding:6px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
.tb td{padding:7px 8px;border-bottom:1px solid #EEF0F6;white-space:nowrap}.tb tr:last-child td{border-bottom:0}
.fl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{border:1px solid var(--ln);border-radius:8px;padding:6px 10px;background:var(--card);color:var(--mu);min-width:120px}
.lab{font-weight:600;font-size:12px;margin:0 0 3px}.fld{margin-bottom:9px}.fld .inp{display:block;width:100%}
.hb{height:6px;border-radius:3px;background:#E9ECF4;overflow:hidden}.hb i{display:block;height:100%;background:var(--ok)}
.chp{border:1px solid var(--ln);border-radius:999px;padding:3px 11px;background:var(--card)}.chp.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cc .sw{height:74px;border-radius:8px;margin-bottom:8px;background:var(--c);display:grid;place-items:center;color:#fff;font:700 15px 'Bricolage Grotesque',sans-serif}
.cc b{display:block}.cc .hb{margin:6px 0}
.login{flex:1;display:grid;grid-template-columns:1.1fr 1fr;min-height:540px}
.login .l{background:var(--ink);color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.login .l h3{font:700 28px/1.15 'Bricolage Grotesque',sans-serif}.login .r{display:grid;place-items:center;background:var(--card);padding:24px}.login .r>div{width:320px}
.flow{display:flex;align-items:stretch;gap:10px}.flow .cardm{flex:1}.flow .ar{align-self:center;font-size:20px;color:var(--mu)}
.flow .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ink);font-weight:700;margin-bottom:6px}
.player{background:#111729;border-radius:10px;height:290px;display:grid;place-items:center;color:#fff;position:relative}
.player .pb{position:absolute;left:14px;right:14px;bottom:12px}.player .hb{background:#38405E}.player .hb i{background:var(--gold)}
.play{width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-size:22px}
.les{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--ln)}.les:last-child{border:0}
.les .st{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-size:10px}
.les .st.d{background:var(--ok);border-color:var(--ok);color:#fff}.les .st.c{border-color:var(--gold);background:#FFF1D6}
.opt{border:1.5px solid var(--ln);border-radius:9px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;background:var(--card);cursor:pointer}
.opt b{width:22px;height:22px;border-radius:50%;background:var(--mbg);display:grid;place-items:center;flex:none}
.opt.sel{border-color:var(--ink);background:#E6EAF8}.opt.sel b{background:var(--ink);color:#fff}
.qn{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.qn span{border:1px solid var(--ln);border-radius:6px;text-align:center;padding:4px 0}
.qn .a{background:#E6EAF8;border-color:var(--ink)}.qn .c{background:var(--gold);border-color:var(--gold)}
.cert{border:6px double var(--gold);background:#FFFDF6;border-radius:6px;padding:26px;text-align:center}
.cert h3{font:700 30px 'Bricolage Grotesque',sans-serif;color:var(--ink)}.cert .nm{font:700 26px 'Bricolage Grotesque',sans-serif;border-bottom:1px solid var(--ln);display:inline-block;padding:2px 24px;margin:8px 0}
.seal{width:54px;height:54px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-weight:700;margin:10px auto 0}
.ovl{position:absolute;inset:0;background:rgba(15,23,42,.45);display:none;justify-content:flex-end;z-index:5}.ovl.show{display:flex}
.pnl{background:#fff;width:340px;height:100%;overflow:auto;padding:16px;box-shadow:-8px 0 30px rgba(0,0,0,.18)}.pnl h5{display:flex;justify-content:space-between;margin:0 0 10px;font:700 16px 'Bricolage Grotesque',sans-serif}
.x{cursor:pointer;color:var(--mu);font-weight:700}[data-open]{cursor:pointer}
.mat td,.mat th{text-align:center}.mat td:first-child,.mat th:first-child{text-align:left}.frame input[type=checkbox]{accent-color:var(--ink);width:15px;height:15px;margin:0 6px 0 0;vertical-align:middle;cursor:pointer}.mat input{margin:0}.yes{color:var(--ok);font-weight:700}.no{color:#B7BDCC}
.rsw button{border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:999px;padding:6px 14px;font:600 13px 'Figtree',sans-serif;cursor:pointer}.rsw button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
<h1>LMS — Student design</h1>
<p>What a student sees: browse only approved courses, subscribe (single course, bundle or annual package) or use access granted by an instructor or admin, then learn through videos, quiz and certificate.</p>
</div></header>
<nav class="tabs" aria-label="Pages"><div class="trow" id="tabs" role="tablist"></div></nav>
<main class="wrap"><section class="page" id="view" aria-live="polite"></section></main>
<script>
const ROLE='student';
const P={home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5V22h16"/>',play:'<circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z"/>',check:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',award:'<circle cx="12" cy="8" r="6"/><path d="M15.5 13.5L17 22l-5-3-5 3 1.5-8.5"/>',users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>',edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',search:'<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>',bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'};
const ic=(k,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[k]}</svg>`;
const pl=(t,c)=>`<span class="pl ${c}">${t}</span>`;
const kpi=(l,v,s)=>`<div class="cardm kpi"><div class="lb">${l}</div><div class="v">${v}</div><div class="up">${s}</div></div>`;
const NAVS={student:[['Learn',[['dashboard','Dashboard','home'],['courses','Courses','book'],['video','My lessons','play'],['quiz','Quizzes','check'],['certificate','Certificates','award']]],['Account',[['pricing','Subscription','award'],['myinstr','My instructor','users']]]],
instructor:[['Teach',[['dashboard','Dashboard','home'],['manage','My courses','edit'],['mystudents','My students','users'],['grant','Grant access','check']]]],
admin:[['Admin',[['dashboard','Dashboard','home'],['approval','Course approval','check'],['allcourses','All courses','book'],['users','Users','users'],['roles','Roles & permissions','award'],['assign','Assign instructors','users'],['plans','Plans','award'],['grant','Grant access','check']]]]};
const WHO={student:['Arun','Student','A'],instructor:['Ravi K.','Instructor','R'],admin:['Admin','Admin','A']};
const roleOf=()=>ROLE;
const sidebar=(a,r)=>`<aside class="side"><div class="brand"><i>${ic('book',15)}</i>LearnHub</div>${NAVS[r].map(([g,it])=>`<div class="grp">${g}</div>`+it.map(([id,l,i])=>`<div class="nav ${id===a?'on':''}">${ic(i)}${l}</div>`).join('')).join('')}<div class="foot">v1.0</div></aside>`;
const topbar=(t,r)=>{const w=WHO[r];return `<div class="top"><h4>${t}</h4><div class="sbox">${ic('search',14)}Search courses, lessons</div><div class="bell">${ic('bell',15)}<em>2</em></div><div class="av"><i>${w[2]}</i><div><b>${w[0]}</b><div class="mu" style="font-size:11px">${w[1]}</div></div></div></div>`};
const shell=(a,t,b,o='',r)=>{r=r||roleOf(a);return `<div class="frame">${sidebar(a,r)}<div class="mainc">${topbar(t,r)}<div class="body">${b}</div></div>${o}</div>`};
let dashRole=ROLE;
const COURSES=[['Web Development Basics','#2C3B80','Ravi K.','24 videos',65],['Python for Beginners','#1E9E6A','Meena S.','30 videos',100],['Digital Marketing','#C67B00','John P.','18 videos',0],['Data Analysis with Excel','#7A3FB0','Anita R.','20 videos',30],['UI/UX Design','#D64545','Karthik V.','16 videos',0],['Communication Skills','#0F7C8C','Divya M.','12 videos',100]];
const RULES=[['Only students pay','instructors and admins never see a paywall.'],['Three plans, one price each','Single course = one price; Course bundle (a set of courses) = one price; Annual package (all courses for 12 months) = one price.'],['Access without payment','an instructor or admin can grant any student access to a course, no purchase needed.'],['Publish with approval','instructors and admins both create courses; a new course stays Pending until an admin approves it.'],['Students see only Published courses','after approval the course appears in the student catalog.'],['Instructor assignment','the admin assigns an instructor to every student.']];
const FL={student:[['Browse','Only approved courses are listed.'],['Subscribe','Single, bundle or annual plan, or access granted by your instructor.'],['Videos','Watch module by module.'],['Quiz','Pass mark 70%.'],['Certificate','Issued after passing.']],instructor:[['Create','Course info, videos and quiz.'],['Submit','Status becomes Pending approval.'],['Admin approves','The course is checked and approved.'],['Published','Now visible to students.'],['Support','Grant access and follow assigned students.']],admin:[['Review','See courses submitted for approval.'],['Approve','The course becomes Published.'],['Assign','Give every student an instructor.'],['Plans','Set single, bundle and annual prices.'],['Control','Users, roles and access grants.']]};
const DF={student:[['Subscription plan','active plan and renewal date, plus courses granted by an instructor.'],['Continue learning','resume the last lesson.'],['Upcoming quiz','quizzes that are ready to take.'],['My courses','progress and certificates.']],instructor:[['Assigned students','the students the admin gave you.'],['My courses','status of each: Draft, Pending approval, Published.'],['Quick actions','new course, upload video, add quiz.'],['Recent activity','enrollments, quiz results, certificates.']],admin:[['Pending approvals','instructor requests and courses waiting for you.'],['Subscriptions','active plans by type.'],['Users and courses','totals and growth.'],['Recent activity','important changes.']]};
const M={};
M.overview=()=>`<div class="frame" style="display:block;padding:16px;min-height:0">
<div class="cardm" style="margin-bottom:12px"><h5>Learner journey <small>each step unlocks the next one</small></h5>
<div class="flow"><div class="cardm"><span class="n">1</span><b>Courses</b><div class="mu">Browse, search and enroll in a course.</div></div><span class="ar">→</span>
<div class="cardm"><span class="n">2</span><b>Videos</b><div class="mu">Watch lessons module by module; progress is saved.</div></div><span class="ar">→</span>
<div class="cardm"><span class="n">3</span><b>Quiz</b><div class="mu">Unlocks after all videos; pass mark 70%.</div></div><span class="ar">→</span>
<div class="cardm"><span class="n">4</span><b>Certificate</b><div class="mu">Issued automatically after passing; PDF with verify code.</div></div></div></div>
<div class="g3"><div class="cardm"><h5>Student pages</h5>Login · Register · Dashboard · Course catalog · Course details · Video lesson · Quiz · Result · Certificates</div>
<div class="cardm"><h5>Instructor pages</h5>Manage courses · Add modules and videos · Quiz builder · Student progress</div>
<div class="cardm"><h5>Admin pages</h5>Users · Roles and permissions · Course approval · Certificate template · Reports</div></div></div>`;
M.login=()=>`<div class="frame"><div class="login"><div class="l"><div class="brand"><i>${ic('book',15)}</i>LearnHub</div><h3>Learn at your pace.<br>Earn your certificate.</h3><div>Courses, video lessons, quizzes and certificates in one place.</div></div>
<div class="r"><div><h3 style="font:700 22px 'Bricolage Grotesque'">Sign in</h3><div class="mu" style="margin-bottom:12px">Welcome back</div>
<div class="fld"><div class="lab">Email</div><span class="inp">you@example.com</span></div><div class="fld"><div class="lab">Password</div><span class="inp">••••••••</span></div>
<div class="fl" style="justify-content:space-between;margin-bottom:12px"><span><input type="checkbox"> Remember me</span><span class="mu">Forgot password?</span></div><span class="bt pr lg" style="display:flex;justify-content:center">Sign in</span>
<div class="mu" style="margin-top:12px;text-align:center">New here? <b>Create an account</b></div></div></div></div></div>`;
M.dashboard=(r='student')=>{
if(r=='instructor')return shell('dashboard','Instructor dashboard',`<div class="g4">${kpi('My courses','3','1 pending approval')}${kpi('Total learners','2,220','+86 this month')}${kpi('Avg completion','68%','Up 4%')}${kpi('Assigned students','48','Assigned by admin')}</div>
<div class="g2"><div class="cardm"><h5>Quick actions</h5><div class="fl"><span class="bt gd">+ New course</span><span class="bt">⬆ Upload video</span><span class="bt">+ Add quiz</span></div><div class="mu" style="margin-top:10px">UI/UX Design is waiting for admin approval</div></div>
<div class="cardm"><h5>Recent activity</h5>• 12 new enrollments in Web Development Basics<br>• 5 learners passed the Python quiz<br>• 3 certificates issued today</div></div>
<div class="cardm"><h5>My courses performance</h5><table class="tb"><tr><th>Course</th><th>Learners</th><th>Completion</th><th>Avg quiz</th><th>Status</th></tr><tr><td>Web Development Basics</td><td>1,240</td><td>65%</td><td>78%</td><td>${pl('Published','ok')}</td></tr><tr><td>Python for Beginners</td><td>980</td><td>72%</td><td>74%</td><td>${pl('Published','ok')}</td></tr><tr><td>UI/UX Design</td><td>0</td><td>—</td><td>—</td><td>${pl('Pending approval','wa')}</td></tr></table></div>`,'','instructor');

const o=view.querySelector('#opts');if(o)o.addEventListener('click',e=>{const t=e.target.closest('.opt');if(!t)return;o.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));t.classList.add('sel');});
